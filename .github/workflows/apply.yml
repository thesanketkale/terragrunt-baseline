name: Terragrunt Apply

on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'modules/**'
      - '_envcommon/**'
      - 'root.hcl'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Specific environment to deploy to (dev, stage, prod, all)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
          - all

concurrency:
  group: terragrunt-apply-main
  cancel-in-progress: false

permissions: {}

jobs:
  apply-dev:
    name: Deploy - Dev Environment
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    if: github.event_name == 'push' || inputs.target_env == 'dev' || inputs.target_env == 'all'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          TG_VERSION="v0.63.6"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS OIDC Credentials
        if: env.AWS_APPLY_ROLE != ''
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        env:
          AWS_APPLY_ROLE: ${{ secrets.AWS_APPLY_ROLE_ARN }}

      - name: Azure OIDC Login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Execute Terragrunt Apply (Dev)
        run: |
          echo "Executing Terragrunt Apply for dev environment..."
          # Command template:
          # terragrunt run-all apply --terragrunt-non-interactive

  apply-stage:
    name: Deploy - Staging Environment
    needs: [apply-dev]
    runs-on: ubuntu-latest
    environment: stage
    timeout-minutes: 45
    if: github.event_name == 'push' || inputs.target_env == 'stage' || inputs.target_env == 'all'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          TG_VERSION="v0.63.6"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS OIDC Credentials
        if: env.AWS_APPLY_ROLE != ''
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        env:
          AWS_APPLY_ROLE: ${{ secrets.AWS_APPLY_ROLE_ARN }}

      - name: Azure OIDC Login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Execute Terragrunt Apply (Stage)
        run: |
          echo "Executing Terragrunt Apply for stage environment..."

  apply-prod:
    name: Deploy - Production Environment
    needs: [apply-stage]
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    if: github.event_name == 'push' || inputs.target_env == 'prod' || inputs.target_env == 'all'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          TG_VERSION="v0.63.6"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS OIDC Credentials
        if: env.AWS_APPLY_ROLE != ''
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        env:
          AWS_APPLY_ROLE: ${{ secrets.AWS_APPLY_ROLE_ARN }}

      - name: Azure OIDC Login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Execute Terragrunt Apply (Prod)
        run: |
          echo "Executing Terragrunt Apply for prod environment..."
