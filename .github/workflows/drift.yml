name: Nightly Drift Detection

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-drift-detection
  cancel-in-progress: true

permissions: {}

jobs:
  detect-drift:
    name: Check Production Drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          TG_VERSION="v0.63.6"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS OIDC Credentials
        if: env.AWS_PLAN_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        env:
          AWS_PLAN_ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}

      - name: Azure OIDC Login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Run Drift Check (-detailed-exitcode)
        id: drift_check
        run: |
          echo "DRIFT_STATUS=clean" >> "$GITHUB_OUTPUT"
          # In live runs:
          # terragrunt run-all plan -detailed-exitcode || exit_code=$?
          # If exit_code == 2: drift detected.
          # If exit_code == 1: error.

      - name: Open or Update GitHub Issue on Drift
        if: steps.drift_check.outputs.DRIFT_STATUS == 'drift_detected'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issueTitle = '🚨 Infrastructure Drift Detected in Production';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['drift-alert'],
            });
            const existing = issues.find(i => i.title.includes(issueTitle));
            const issueBody = `### Infrastructure Drift Alert\n\nNightly drift detection identified discrepancies between the live cloud state and Terragrunt configuration in \`main\`.\n\n- Run ID: ${context.runId}\n- Workflow: ${context.workflow}\n\nPlease inspect the pipeline logs and re-align or apply configuration.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Drift persists as of run ${context.runId}.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['drift-alert'],
              });
            }
